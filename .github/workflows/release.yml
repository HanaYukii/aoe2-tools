name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m unittest discover -s opponent-civ -p "test_*.py" -v
      - run: python opponent-civ/build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: aoe2-windows-x64
          path: opponent-civ/build/release/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "AoE2 對局筆記 $env:GITHUB_REF_NAME" --generate-notes opponent-civ/build/release/aoe2-opponent-dashboard.exe opponent-civ/build/release/SHA256SUMS.txt
